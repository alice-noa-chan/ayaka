[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayaka"
version = "0.1.0"
description = "Electra: a non-autoregressive decision model family on Gemma 4 (shared state prefix + isolated question branches + permutation-equivariant candidate sets + pointer/label distribution readout + per-primitive calibration)"
requires-python = ">=3.10"
license = {text = "MIT"}
urls = {Homepage = "https://github.com/alice-noa-chan/ayaka"}
dependencies = [
    "torch>=2.6",
    "transformers>=5.6",
    "peft>=0.19",
    "huggingface_hub>=0.30",
    "safetensors",
]

[project.optional-dependencies]
data = ["datasets>=3.0"]
beam = ["beam-client>=0.2.200"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "datasets>=3.0",
]

[tool.setuptools.packages.find]
include = ["ayaka*"]

[tool.setuptools.package-data]
"ayaka.eval" = ["data/*.json", "data/jevbench_public/*"]
"ayaka.data" = ["legalbench_tasks.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["ayaka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
