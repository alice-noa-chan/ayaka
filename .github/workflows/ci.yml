# Lint, format and CPU test checks for every push and pull request.
# GPU runs are never started here; tests use tiny CPU models and saved data.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        # Same ruff release as the local development environment.
        run: python -m pip install ruff==0.16.8
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install CPU torch
        # torchvision comes from the same index so pip never swaps in a CUDA torch.
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ayaka with the verified version pins
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Run tests
        run: python -m pytest
